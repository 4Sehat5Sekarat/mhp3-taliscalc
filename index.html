<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>MHP3RDHD Custom Talisman</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="main">
      <h3 class="title">MHP3RD Calculator</h3>
      <div class="skillPicker">
        <select id="firstSkillId">
          <option value="0" disabled selected>Option Skill 1</option>
        </select>

        <select id="secondSkillId" class="skillPicker">
          <option value="0" disabled selected>Option Skill 2</option>
        </select>
      </div>

      <div class="skillPicker">
        <input type="number" id="firstSkillLevel" placeholder="Level Skill 1" />
        <input
          type="number"
          id="secondSkillLevel"
          placeholder="Level Skill 2"
        />
      </div>

      <div class="skillPicker">
        <select id="talismanRarity"></select>

        <select id="numberOfSlot">
          <option value="0">No slot</option>
          <option value="1">1 Slot</option>
          <option value="2">2 Slot</option>
          <option value="3">3 Slot</option>
        </select>
        <select id="boxSlot"></select>
      </div>

      <div id="output" class="output"></div>

      <button id="buttonCopy" class="buttonCopy">Copy</button>
    </div>

    <button id="buttonTheme" class="buttonTheme">Tema</button>

    <script src="js/populate.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
